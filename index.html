<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        #pergunta {
        background-color: white;
        border-radius: 12px;
        padding: 24px;
        max-width: 400px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-size: 20px;
        }

        #opcoes {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 400px;
        margin-top: 16px;
        }

        button {
        background-color: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
        }

        button:hover {
        background-color: #357abd;
        }

    </style>

</head>
<body>
    <h1>Quiz de Curiosidades</h1>

    <div id="pergunta">
        <!-- aqui vai aparecer a pergunta -->
    </div>

    <div id="opcoes">
        
    </div>

    <script>
        const perguntas = [
            {
                pergunta: "Qual é o maior planeta do Sistema Solar?",
                opcoes: ["Terra", "Júpiter", "Saturno"],
                correta: 1
            },
            {
                pergunta: "Quantos continentes existem?",
                opcoes: ["5", "6", "7"],
                correta: 2
            }
        ];

        let indiceAtual = 0;
        let pontuacao = 0;

    const divPergunta = document.getElementById("pergunta");
    const divOpcoes = document.getElementById("opcoes");

    function mostrarPergunta() {
        const atual = perguntas[indiceAtual];
        divPergunta.textContent = atual.pergunta;

    divOpcoes.innerHTML = "";

    atual.opcoes.forEach(function(opcao, indice) {
        const botao = document.createElement("button");
        botao.textContent = opcao;

        botao.addEventListener("click", function() {
            verificarResposta(indice);
        });

        divOpcoes.appendChild(botao);
    });
}
    function verificarResposta(indiceEscolhido) {
        const atual = perguntas[indiceAtual];

        if (indiceEscolhido === atual.correta) {
            alert("Acertou! 🎉");
            pontuacao = pontuacao + 1;
        } else {
            alert("Errou! A resposta certa era: " + atual.opcoes[atual.correta]);
        }

           indiceAtual = indiceAtual + 1;

        if (indiceAtual < perguntas.length) {
            mostrarPergunta();
        } else {
        divPergunta.textContent = "Fim do quiz! Você acertou " + pontuacao + " de " + perguntas.length + " perguntas.";
        divOpcoes.innerHTML = "";
    }

 }

    mostrarPergunta();
    </script>
</body>
</html>
